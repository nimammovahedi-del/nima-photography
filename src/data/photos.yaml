# One entry per photo. Order here = order on the page.
#
#   file:     path inside src/photos/ (the folder sets the main tab)
#   title:    shown in captions
#   alt:      describes the photo for screen readers — please always fill this in
#   sub:      sub-tab, e.g. Georgian & Classical (Architecture), Coast (Nature), Birds (Animals)
#             — the list of sub-tabs lives in src/site.config.ts
#   cover:    true on one photo per sub-tab makes it that sub-tab's cover on the subject's
#             landing page (e.g. /architecture); without one, the sub-tab's first photo is used
#   country:  where it was taken (must match a country in site.config.ts) — the photo
#   city:     then also appears under Places → that country / city, whatever its tab
#   filmSim:  film photos only, e.g. Classic Chrome, Kodak Portra 400
#   tags:     what's in the photo, e.g. [harbour, boats, sunset] — not shown on the site yet,
#             a working list for sorting photos into tabs
#
# Camera settings are read from the photo's EXIF automatically.

