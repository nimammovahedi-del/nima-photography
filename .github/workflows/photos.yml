# Uploads new photos to Cloudflare R2 and makes their web versions (see scripts/sync-photos.mjs).
#
# Runs when photos are pushed to src/photos/ on any branch, or by hand from the Actions tab
# ("Run workflow") after uploading or deleting originals in the R2 dashboard. It commits the
# updated src/data/photo-manifest.json (and the removal of the uploaded files) back to the branch,
# and Vercel then builds the site from that commit.
name: Photos

on:
  push:
    paths: ['src/photos/**', 'scripts/sync-photos.mjs', '.github/workflows/photos.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-photos.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
      - name: Commit the manifest
        run: |
          git add -A src/photos src/data/photo-manifest.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update photos from R2"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
